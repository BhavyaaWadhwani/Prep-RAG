<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlacementPrep AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#1B2433; --muted:#5B6778; --line:#D5DBE3;
  --accent:#0F766E; --accent-ink:#FFFFFF; --chip:#DDF1EE; --danger:#B42318;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151D; --surface:#17202B; --ink:#E6EBF2; --muted:#93A0B3; --line:#2A3544;
    --accent:#2DD4BF; --accent-ink:#06201C; --chip:#12332F; --danger:#F97066; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{display:grid;grid-template-columns:300px 1fr;height:100%;max-width:1180px;margin:0 auto}
aside{border-right:1px solid var(--line);padding:24px 20px;overflow-y:auto;background:var(--surface)}
main{display:flex;flex-direction:column;min-width:0;height:100%}
h1{font-family:var(--serif);font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:600}
.tag{color:var(--muted);font-size:13px;margin:0 0 24px}
h2{font-size:13px;font-weight:600;margin:24px 0 8px;color:var(--muted)}
.doc{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.doc span.n{overflow-wrap:anywhere}
.doc small{color:var(--muted);white-space:nowrap}
.doc button{background:none;border:0;color:var(--danger);cursor:pointer;font:inherit;font-size:12px;padding:2px 4px}
.empty{color:var(--muted);font-size:13px}
input[type=password],input[type=file],textarea{font:inherit;color:var(--ink)}
input[type=password]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-bottom:8px}
input[type=file]{width:100%;font-size:12px;margin-bottom:8px}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:500;cursor:pointer}
button.primary:disabled{opacity:.55;cursor:default}
#upmsg{font-size:12px;margin-top:6px;color:var(--muted)}
#thread{flex:1;overflow-y:auto;padding:28px 28px 12px}
.hint{max-width:560px;margin:8vh auto 0;color:var(--muted)}
.hint h3{font-family:var(--serif);font-size:26px;color:var(--ink);margin:0 0 10px;font-weight:600}
.hint button{display:block;text-align:left;width:100%;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.hint button:hover{border-color:var(--accent)}
.q{margin:22px 0 8px;font-weight:600;max-width:720px}
.a{font-family:var(--serif);font-size:17px;line-height:1.65;max-width:700px;white-space:pre-wrap}
.cite{display:inline-block;background:var(--chip);color:var(--accent);border-radius:4px;padding:0 5px;font-family:var(--sans);font-size:12px;font-weight:600;margin:0 1px}
.src{margin-top:12px;max-width:720px}
.src details{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.src summary{cursor:pointer;color:var(--muted)}
.src summary b{color:var(--ink);font-weight:500}
.src p{margin:6px 0 0;color:var(--muted);white-space:pre-wrap}
form{display:flex;gap:10px;padding:14px 28px 20px;border-top:1px solid var(--line);background:var(--surface)}
textarea{flex:1;resize:none;height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--danger)}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);max-height:34vh;padding:16px}
  #thread{padding:18px 16px 8px} form{padding:12px 16px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>PlacementPrep AI</h1>
    <p class="tag">Ask questions about interviews and prep notes. Every answer shows where it came from.</p>
    <h2>Knowledge base</h2>
    <div id="docs"><p class="empty">Loading documents…</p></div>
    <h2>Add a document</h2>
    <input type="password" id="adminKey" placeholder="Admin key (if required)" autocomplete="off">
    <input type="file" id="file" accept=".pdf,.txt,.md">
    <button class="primary" id="upload">Upload document</button>
    <div id="upmsg" role="status"></div>
  </aside>
  <main>
    <div id="thread" aria-live="polite">
      <div class="hint" id="hint">
        <h3>What are you preparing for?</h3>
        <p>Try one of these, or ask your own question.</p>
        <button type="button" data-q="What topics are asked in the online assessment round?">What topics are asked in the online assessment round?</button>
        <button type="button" data-q="How should I structure my answer to 'Tell me about yourself'?">How should I structure my answer to “Tell me about yourself”?</button>
        <button type="button" data-q="Which DSA patterns should I revise first?">Which DSA patterns should I revise first?</button>
      </div>
    </div>
    <form id="askForm">
      <textarea id="question" maxlength="500" placeholder="Ask a question…" aria-label="Your question" required></textarea>
      <button class="primary" id="send" type="submit">Ask</button>
    </form>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const thread = $("thread");

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

// Render model text safely: plain text nodes, with [n] turned into citation chips.
function renderAnswer(target, text){
  text.split(/(\[\d+\])/g).forEach(part => {
    if(/^\[\d+\]$/.test(part)) target.appendChild(el("span","cite",part.slice(1,-1)));
    else target.appendChild(document.createTextNode(part));
  });
}

async function loadDocs(){
  const box = $("docs");
  try{
    const docs = await (await fetch("/api/documents")).json();
    box.replaceChildren();
    if(!docs.length){ box.appendChild(el("p","empty","No documents yet. Upload a PDF, TXT or MD file to begin.")); return; }
    docs.forEach(d => {
      const row = el("div","doc");
      row.appendChild(el("span","n",d.name));
      row.appendChild(el("small","",d.chunks + " chunks"));
      const del = el("button","","Delete");
      del.type = "button";
      del.onclick = () => removeDoc(d.name);
      row.appendChild(del);
      box.appendChild(row);
    });
  }catch{ box.replaceChildren(el("p","empty err","Could not load documents. Refresh to try again.")); }
}

function adminHeaders(){
  const k = $("adminKey").value.trim();
  return k ? {"X-Admin-Key": k} : {};
}

async function removeDoc(name){
  if(!confirm("Delete " + name + " from the knowledge base?")) return;
  const r = await fetch("/api/documents/" + encodeURIComponent(name), {method:"DELETE", headers: adminHeaders()});
  $("upmsg").textContent = r.ok ? "Deleted " + name : "Delete failed: check the admin key.";
  loadDocs();
}

$("upload").onclick = async () => {
  const f = $("file").files[0];
  if(!f){ $("upmsg").textContent = "Choose a file first."; return; }
  const fd = new FormData(); fd.append("file", f);
  $("upload").disabled = true; $("upmsg").textContent = "Reading and indexing " + f.name + "…";
  try{
    const r = await fetch("/api/documents", {method:"POST", body: fd, headers: adminHeaders()});
    const j = await r.json();
    $("upmsg").textContent = r.ok ? "Added " + j.name + " (" + j.chunks + " chunks)." : (j.detail || "Upload failed.");
    if(r.ok){ $("file").value = ""; loadDocs(); }
  }catch{ $("upmsg").textContent = "Upload failed. Check your connection."; }
  $("upload").disabled = false;
};

async function ask(question){
  $("hint")?.remove();
  thread.appendChild(el("div","q",question));
  const a = el("div","a","Searching the knowledge base…");
  thread.appendChild(a);
  thread.scrollTop = thread.scrollHeight;
  $("send").disabled = true;
  try{
    const r = await fetch("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question})});
    const j = await r.json();
    if(!r.ok) throw new Error(j.detail || "Request failed");
    a.textContent = ""; renderAnswer(a, j.answer);
    if(j.sources.length){
      const box = el("div","src");
      j.sources.forEach(s => {
        const d = document.createElement("details");
        const sm = document.createElement("summary");
        const label = s.source + (s.page ? ", page " + s.page : "");
        sm.appendChild(el("b","", "[" + s.id + "] " + label));
        sm.appendChild(document.createTextNode("  match " + Math.round(s.similarity*100) + "%"));
        d.appendChild(sm); d.appendChild(el("p","",s.snippet + (s.snippet.length >= 300 ? "…" : "")));
        box.appendChild(d);
      });
      thread.appendChild(box);
    }
  }catch(e){ a.textContent = e.message; a.classList.add("err"); }
  $("send").disabled = false;
  thread.scrollTop = thread.scrollHeight;
}

$("askForm").onsubmit = (e) => {
  e.preventDefault();
  const q = $("question").value.trim();
  if(q.length < 3) return;
  $("question").value = ""; ask(q);
};
$("question").addEventListener("keydown", (e) => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("askForm").requestSubmit(); }
});
document.querySelectorAll(".hint button").forEach(b => b.onclick = () => ask(b.dataset.q));
loadDocs();
</script>
</body>
</html>
